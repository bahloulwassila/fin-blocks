services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fin
      POSTGRES_PASSWORD: fin
      POSTGRES_DB: fin_blocks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: fin
      POSTGRES_PASSWORD: fin
      POSTGRES_DB: fin_blocks_test
    ports:
      - "5433:5432"
volumes:
  pgdata:
